name: Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag used for manual runs, for example v0.1.0"
        required: true
        default: "v0.1.0"
      draft:
        description: "Create or update the GitHub Release as a draft"
        type: boolean
        required: true
        default: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os_name: windows
            runner: windows-2022
            artifact_name: windows-x64

          - label: Linux x64
            os_name: linux
            runner: ubuntu-22.04
            artifact_name: linux-x64

          - label: macOS
            os_name: macos
            runner: macos-latest
            artifact_name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        shell: bash
        run: npm run build

      - name: Build Tauri bundles
        shell: bash
        run: npx tauri build

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          out_dir="release-artifacts/${{ matrix.artifact_name }}"
          mkdir -p "$out_dir"

          artifacts="$(
            find src-tauri/target/release/bundle -type f \
              \( \
                -name '*.msi' -o \
                -name '*setup.exe' -o \
                -name '*.deb' -o \
                -name '*.rpm' -o \
                -name '*.AppImage' -o \
                -name '*.dmg' -o \
                -name '*.app.tar.gz' -o \
                -name '*.app.tar.gz.sig' \
              \) \
              -print
          )"

          if [ -z "$artifacts" ]; then
            echo "No releasable Tauri bundle artifacts were found." >&2
            find src-tauri/target/release/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi

          printf '%s\n' "$artifacts"

          while IFS= read -r file; do
            cp "$file" "$out_dir/"
          done <<< "$artifacts"

          echo "Collected artifacts:"
          find "$out_dir" -type f -maxdepth 1 -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/${{ matrix.artifact_name }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: List release files
        shell: bash
        run: |
          find release-downloads -type f -maxdepth 2 -print

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          draft: ${{ steps.release_meta.outputs.draft }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          files: release-downloads/**/*
          fail_on_unmatched_files: true
