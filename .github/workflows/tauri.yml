name: Tauri

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-latest
          - name: windows
            platform: windows-latest
          - name: macos
            platform: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: npm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Generate platform icons
        run: cargo tauri icon src-tauri/icons/icon.png

      - name: Type check frontend
        working-directory: frontend/app
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: frontend/app
        run: npm test -- --ci --runInBand

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload Linux bundles
        if: always() && matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload Windows bundles
        if: always() && matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS bundles
        if: always() && matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
